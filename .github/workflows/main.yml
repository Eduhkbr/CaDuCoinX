name: Validate and deploy to Optimism Sepolia

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_testnet:
        description: Deploy the reviewed main branch to Optimism Sepolia
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high and critical dependency advisories
        run: npm audit --audit-level=high

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

  deploy-testnet:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_testnet == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: optimism-sepolia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high and critical dependency advisories
        run: npm audit --audit-level=high

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Deploy to Optimism Sepolia
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          OPTIMISM_SEPOLIA_RPC_URL: ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL }}
          CDX_ADMIN_ADDRESS: ${{ vars.CDX_ADMIN_ADDRESS }}
          CDX_FEE_COLLECTOR_ADDRESS: ${{ vars.CDX_FEE_COLLECTOR_ADDRESS }}
          NAME_TOKEN: ${{ vars.NAME_TOKEN }}
          SYMBOL: ${{ vars.SYMBOL }}
          UNISWAP_V3_FACTORY_ADDRESS: ${{ vars.UNISWAP_V3_FACTORY_ADDRESS }}
        run: npm run deploy:testnet
